apiVersion: v1
kind: Pod
metadata:
  name: {{ include "hyperdx.fullname" . }}-test-connection
  labels: {{- include "hyperdx.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.36
      command: [wget]
      args: [{{ printf "http://%s:%v/health" (include "hyperdx.fullname" .) .Values.hyperdx.service.apiPort | quote }}]
