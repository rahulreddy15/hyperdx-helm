{{- $collectorGiven := ternary .Values.clickhouse.auth.collectorPassword .Values.clickhouse.external.collectorPassword .Values.clickhouse.enabled -}}
{{- $appGiven := ternary .Values.clickhouse.auth.appPassword .Values.clickhouse.external.appPassword .Values.clickhouse.enabled -}}
{{- $collector := include "hyperdx.clickhousePassword" (list . "clickhouse-collector-password" $collectorGiven .Values.clickhouse.auth.existingSecretCollectorPasswordKey) -}}
{{- $app := include "hyperdx.clickhousePassword" (list . "clickhouse-app-password" $appGiven .Values.clickhouse.auth.existingSecretAppPasswordKey) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hyperdx.fullname" . }}
  labels: {{- include "hyperdx.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    {{- with .Values.commonAnnotations }}{{ toYaml . | nindent 4 }}{{ end }}
type: Opaque
stringData:
  # These are each generated in this template only, then consumed through Secret refs;
  # lookup therefore safely keeps them stable. Rotating the session secret logs out users.
  express-session-secret: {{ include "hyperdx.persisted" (list . "express-session-secret" .Values.auth.sessionSecret) | quote }}
  clickhouse-collector-password: {{ $collector | quote }}
  clickhouse-app-password: {{ $app | quote }}
  mongodb-password: {{ include "hyperdx.persisted" (list . "mongodb-password" .Values.mongodb.password) | quote }}
  default-connections: {{ list (dict "name" "Default" "host" (printf "http://%s:%v" (include "hyperdx.clickhouse.host" .) (include "hyperdx.clickhouse.httpPort" .)) "port" (include "hyperdx.clickhouse.httpPort" . | int) "username" (include "hyperdx.clickhouseAppUser" .) "password" $app) | toJson | quote }}
  api-key: {{ .Values.auth.apiKey | quote }}
