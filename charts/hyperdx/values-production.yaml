# Production baseline for an 8+ vCPU / 32+ GB node. Scale ClickHouse first;
# RAM matters more than CPU for its caches and query execution.
hyperdx:
  replicas: 2
  # Pinned by digest (multi-arch manifest list for appVersion 2.35.0). Digests are
  # content-addressed and identical on docker.hyperdx.io and Docker Hub (verified).
  # On an appVersion bump, take the new digests from the upstream-check issue.
  image:
    digest: sha256:77f691fea2bd54d1e12520952f5243e23282cfec1e402bf521f2c4e90050b073

otelCollector:
  replicas: 2
  image:
    digest: sha256:046d88ecfde94076c6bd2835b82deaafc37036c665be5232b6eb88394a8d0a50
  tablesTtl: "720h"
  resources:
    requests: {cpu: 1, memory: 2Gi}
    limits: {memory: 4Gi}

clickhouse:
  storage: {size: 500Gi}
  resources:
    requests: {cpu: 2, memory: 8Gi}
    limits: {memory: 16Gi}
  keeper:
    replicas: 3

mongodb:
  members: 3
  resources:
    requests: {cpu: 200m, memory: 512Mi}
    limits: {memory: 1Gi}

podDisruptionBudget:
  enabled: true
  minAvailable: 1
