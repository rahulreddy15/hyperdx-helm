name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: helm lint
        run: helm lint charts/hyperdx

      # A bare render with no credentials must FAIL: that is the first-install
      # credential guard (see charts/hyperdx/AGENTS.md, "Credential model").
      - name: Credential guard rejects a bare render
        run: |
          if helm template t charts/hyperdx > /dev/null 2>&1; then
            echo "Expected render to fail without ClickHouse credentials." >&2
            exit 1
          fi

      - name: Render default values (with credentials)
        run: |
          helm template t charts/hyperdx \
            --set clickhouse.auth.collectorPassword=ci-collector \
            --set clickhouse.auth.appPassword=ci-app \
            > /dev/null

      - name: Render every ci/ values file
        run: |
          shopt -s nullglob
          found=0
          for f in charts/hyperdx/ci/*.yaml; do
            found=1
            echo "::group::render $f"
            helm template t charts/hyperdx -f "$f" > /dev/null
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "No ci/ values files found — expected at least one." >&2
            exit 1
          fi

      - name: Render external-backend path
        run: |
          helm template t charts/hyperdx \
            --set clickhouse.enabled=false \
            --set clickhouse.external.host=ch.example.com \
            --set clickhouse.external.collectorUser=otelcollector \
            --set clickhouse.external.collectorPassword=ci-collector \
            --set clickhouse.external.appUser=app \
            --set clickhouse.external.appPassword=ci-app \
            --set mongodb.enabled=false \
            --set mongodb.external.uri=mongodb://user:pass@mongo.example.com/hyperdx \
            > /dev/null

      - name: Render ingress + cronjob path
        run: |
          helm template t charts/hyperdx \
            --set clickhouse.auth.collectorPassword=ci-collector \
            --set clickhouse.auth.appPassword=ci-app \
            --set otelCollector.customConfig='receivers: {}' \
            --set otelCollector.enableDatadogReceiver=true \
            --set clickhouse.externalSecret.name=ch-internal-creds \
            --set bootstrap.register.enabled=true \
            --set bootstrap.register.email=ci@example.com \
            --set bootstrap.register.existingSecret=reg-pw \
            --set-json 'networkPolicy.appIngressFrom=[{"namespaceSelector":{"matchLabels":{"kubernetes.io/metadata.name":"ingress-nginx"}}}]' \
            --set-json 'networkPolicy.telemetryIngressFrom=[{"podSelector":{"matchLabels":{"telemetry":"allowed"}}}]' \
            --set-json 'networkPolicy.fluentdIngressFrom=[{"podSelector":{"matchLabels":{"fluentd":"allowed"}}}]' \
            --set hyperdx.publicUrl=https://hdx.example.com \
            --set ingress.enabled=true \
            --set ingress.host=hdx.example.com \
            --set otlpIngress.enabled=true \
            --set otlpIngress.host=otlp.example.com \
            --set alerting.externalCronJob.enabled=true \
            --set podDisruptionBudget.enabled=true \
            --set networkPolicy.enabled=true \
            > /dev/null

  kubeconform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Install kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/

      # Operator CRDs are not in the standard schema set, so they are skipped.
      # This validates the core Kubernetes objects only.
      - name: Validate rendered manifests
        run: |
          helm template t charts/hyperdx \
            --set clickhouse.auth.collectorPassword=ci-collector \
            --set clickhouse.auth.appPassword=ci-app | \
            kubeconform \
              -strict \
              -summary \
              -kubernetes-version 1.30.0 \
              -skip ClickHouseCluster,KeeperCluster,MongoDBCommunity
